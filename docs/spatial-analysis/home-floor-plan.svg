<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120"><rect width="100%" height="100%" fill="#faf9f5"/><text x="60" y="66.68" fill="#20312f" font-family="Arial,sans-serif" font-size="36" font-weight="700">A floor-plan hypothesis from one home video</text><text x="60" y="103.48" fill="#20312f" font-family="Arial,sans-serif" font-size="21" font-weight="400">IMG_7958 2.MOV  •  57.79 seconds  •  Unmeasured schematic  •  Awaiting your corrections</text><text x="60" y="138.72" fill="#536461" font-family="Arial,sans-serif" font-size="19" font-weight="400">Read left to right along the hall. “Left / right” below means while walking toward the dining room.</text><rect x="65" y="320" width="325" height="420" fill="#edf1ec"/><polyline points="65,320 390,320 390,740 65,740 65,320" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="90" y="456.12" fill="#20312f" font-family="Arial,sans-serif" font-size="24" font-weight="700">SITTING ROOM</text><text x="90" y="488.72" fill="#536461" font-family="Arial,sans-serif" font-size="19" font-weight="400">6–19 s</text><rect x="390" y="535" width="250" height="250" fill="#edf1ec"/><polyline points="390,535 640,535 640,785 390,785 390,535" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="415" y="605.24" fill="#20312f" font-family="Arial,sans-serif" font-size="23" font-weight="700">STUDY / START</text><text x="415" y="635.72" fill="#536461" font-family="Arial,sans-serif" font-size="19" font-weight="400">0–6 s</text><text x="415" y="680.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Shelving, desk,</text><text x="415" y="706.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">monitors, lamp</text><rect x="390" y="355" width="700" height="125" fill="#f0f3f5"/><polyline points="390,355 1090,355 1090,480 390,480 390,355" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/