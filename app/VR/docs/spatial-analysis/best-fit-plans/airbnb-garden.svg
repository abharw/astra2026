1" stroke-width="1"/><text x="38" y="790.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">A1–3</text><text x="110" y="788.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Select a central spine, tandem bedroom connection and bath beside kitchen; the global join is inferred.</text><text x="38" y="860.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">A4</text><text x="110" y="858.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Garden sits beyond the wood-bed exit; assume a side path wraps toward the entrance.</text><text x="38" y="930.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">A5</text><text x="110" y="928.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Use an adjoining workspace alcove from the repeated mirror/art anchors; no extra room is needed.</text><text x="38" y="1004.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Room sizes, exact offsets and window angles are illustrative. Read assumption ledger for alternatives.</text></svg>