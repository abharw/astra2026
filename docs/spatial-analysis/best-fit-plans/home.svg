<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030"><rect width="100%" height="100%" fill="#faf9f5"/><text x="38" y="49.28" fill="#20312f" font-family="Arial,sans-serif" font-size="31" font-weight="700">1 / Supplied home video</text><text x="38" y="81.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">Study → sitting → hall → bathroom / bedroom → dining → kitchen → utility</text><text x="38" y="111.96000000000001" fill="#536461" font-family="Arial,sans-serif" font-size="17" font-weight="400">Unmeasured best-fit plan • amber boundaries/joins are inferred • blue joins have visual support</text><rect x="45" y="220" width="235" height="245" fill="#eef0e9"/><polyline points="45,220 280,220 280,465 45,465 45,220" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="57" y="247.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">SITTING</text><text x="57" y="280.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Sofa / fireplace</text><text x="57" y="303.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Curtained bay • H5</text><rect x="45" y="490" width="235" height="210" fill="#eef0e9"/><polyline points="45,490 280,490 280,700 45,700 45,490" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="57" y="517.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">STUDY</text><text x="57" y="550.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shelving / desk</text><text x="57" y="573.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Return door • H1</text><rect x="305" y="355" width="710" height="105" fill="#eef0e9"/><polyline points="305,355 1015,355 1015,460 305,460 305,355" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="317" y="382.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">HALL</text><text x="317" y="415.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Windows / railing; staggered entries • H2</text><rect x="580" y="180" width="220" height="175" fill="#eef0e9"/><polyline points="580,180 800,180 800,355 580,355 580,180" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="592" y="207.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">BATH</text><text x="592" y="240.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shower / WC / basin</text><rect x="570" y="485" width="250" height="215" fill="#eef0e9"/><polyline points="570,485 820,485 820,700 570,700 570,485" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="582" y="512.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">BEDROOM</text><text x="582" y="545.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Bed / dresser</text><rect x="305" y="185" width="245" height="150" fill="#eef0e9"/><polyline points="305,185 550,185 550,335 305,335 305,185" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="317" y="212.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">STAIRS</text><text x="317" y="245.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Lower landing only • H4</text><rect x="1040" y="180" width="315" height="275" fill="#eef0e9"/><polyline points="1040,180 1355,180 1355,455 1040,455 1040,180" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="1052" y="207.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">DINING</text><text x="1052" y="240.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Table / fireplace</text><text x="1052" y="263.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shallow bay • H5</text><rect x="1040" y="480" width="315" height="105" fill="#eef0e9"/><polyline points="1040,480 1355,480 1355,585 1040,585 1040,480" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="1052" y="507.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">KITCHEN</text><text x="1052" y="540.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Range / peninsula</text><rect x="1140" y="610" width="215" height="90" fill="#eef0e9"/><polyline points="1140,610 1355,610 1355,700 1140,700 1140,610" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="1152" y="637.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">UTILITY</text><text x="1152" y="670.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Open alcove • H3</text><rect x="840" y="500" width="175" height="155" fill="#eef0e9"/><polyline points="840,500 1015,500 1015,655 840,655 840,500" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="852" y="527.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">ACCESS</text><text x="852" y="560.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Closed-door</text><text x="852" y="583.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">placeholders • H4</text><polyline points="180,465 180,490" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="280,385 305,385" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="280,540 315,540 315,460" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="690,335 690,355" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="690,460 690,485" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="1015,405 1040,405" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="1180,455 1180,480" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="1250,585 1250,610" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="425,335 425,355" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="925,460 925,500" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="38,748 1360,748" fill="none" stroke="#536461" stroke-width="1"/><text x="38" y="790.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">H1</text><text x="110" y="788.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Choose the study–hall loop from matching shelving; retain a separate-room alternative.</text><text x="38" y="860.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">H2–3</text><text x="110" y="858.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Use slightly staggered bath/bed doors and an open kitchen utility alcove.</text><text x="38" y="930.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">H4–5</text><text x="110" y="928.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Fill closed-door areas minimally; use shallow bays and simple concealed surface continuation.</text><text x="38" y="1004.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Room sizes, exact offsets and window angles are illustrative. Read assumption ledger for alternatives.</text></svg>