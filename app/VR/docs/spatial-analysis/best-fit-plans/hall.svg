<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030"><rect width="100%" height="100%" fill="#faf9f5"/><text x="38" y="49.28" fill="#20312f" font-family="Arial,sans-serif" font-size="31" font-weight="700">2 / Supplied event-hall video</text><text x="38" y="81.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">One tall main volume; surrounding service spaces are low-confidence placeholders</text><text x="38" y="111.96000000000001" fill="#536461" font-family="Arial,sans-serif" font-size="17" font-weight="400">Unmeasured best-fit plan • amber boundaries/joins are inferred • blue joins have visual support</text><rect x="235" y="165" width="825" height="100" fill="#eef0e9"/><polyline points="235,165 1060,165 1060,265 235,265 235,165" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="247" y="192.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">SERVICE / ACCESS STRIP • E2</text><text x="247" y="225.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Minimal preparation / circulation volume; function unverified</text><rect x="235" y="295" width="825" height="360" fill="#eef0e9"/><polyline points="235,295 1060,295 1060,655 235,655 235,295" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="247" y="322.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">MAIN HALL • E1</text><text x="247" y="355.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Braced glazing at left; stage at right</text><text x="247" y="378.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Tables in center; board / blind wall below</text><text x="247" y="401.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Hidden floor / wall bases continue simply • E3</text><rect x="855" y="430" width="190" height="200" fill="#eef0e9"/><polyline points="855,430 1045,430 1045,630 855,630 855,430" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="867" y="457.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">STAGE</text><text x="867" y="490.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Display / podium</text><rect x="1090" y="495" width="255" height="160" fill="#eef0e9"/><polyline points="1090,495 1345,495 1345,655 1090,655 1090,495" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="1102" y="522.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">SIDE ACCESS</text><text x="1102" y="555.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Stage-corner door</text><text x="1102" y="578.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Destination assumed</text><rect x="40" y="175" width="170" height="200" fill="#eef0e9"/><polyline points="40,175 210,175 210,375 40,375 40,175" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="52" y="198.2" fill="#20312f" font-family="Arial,sans-serif" font-size="15" font-weight="700">UPPER ZONE • E3</text><text x="52" y="235.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Glazing observed</text><text x="52" y="258.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Use unknown</text><text x="52" y="281.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Separate level</text><text x="52" y="304.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">placeholder</text><polyline points="450,265 450,295" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="850,265 850,295" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="1060,600 1090,600" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="38,748 1360,748" fill="none" stroke="#536461" stroke-width="1"/><text x="38" y="790.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">E1</text><text x="110" y="788.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Choose a rectangular envelope from the four linked wall zones; proportions are unmeasured.</text><text x="38" y="860.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">E2</text><text x="110" y="858.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Place shallow service/access volumes behind visible openings rather than leaving them blank.</text><text x="38" y="930.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">E3</text><text x="110" y="928.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Upper space stays undetailed. Flat hidden surfaces are assumptions; no new furniture is invented.</text><text x="38" y="1004.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Room sizes, exact offsets and window angles are illustrative. Read assumption ledger for alternatives.</text></svg>