name: SpatialAssembly
options:
  bundleIdPrefix: com.akeil
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: B2VC49M29M
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: Point at an object to reconstruct and inspect it in augmented reality.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Speak commands to reconstruct and manipulate objects. Audio is sent to OpenAI while voice is on.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Spatial Assembly
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  SpatialAssembly:
    type: application
    platform: iOS
    sources:
      - SpatialAssembly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akeil.spatialassembly
    scheme:
      testTargets:
        - SpatialAssemblyTests

  SpatialAssemblyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpatialAssemblyTests
    dependencies:
      - target: SpatialAssembly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
