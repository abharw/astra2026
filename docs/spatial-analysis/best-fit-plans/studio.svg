<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030"><rect width="100%" height="100%" fill="#faf9f5"/><text x="38" y="49.28" fill="#20312f" font-family="Arial,sans-serif" font-size="31" font-weight="700">3 / Apartment Therapy studio</text><text x="38" y="81.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">Targeted rewatch resolved the folding wall bed; bathroom access remains a selected hypothesis</text><text x="38" y="111.96000000000001" fill="#536461" font-family="Arial,sans-serif" font-size="17" font-weight="400">Unmeasured best-fit plan • amber boundaries/joins are inferred • blue joins have visual support</text><rect x="390" y="170" width="950" height="430" fill="#eef0e9"/><polyline points="390,170 1340,170 1340,600 390,600 390,170" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="402" y="197.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">MAIN STUDIO</text><text x="402" y="230.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Sofa along left wall; fireplace/TV opposite</text><text x="402" y="253.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Tall windows across upper end; center panel is a mirror • S3</text><rect x="1050" y="275" width="270" height="150" fill="#eef0e9"/><polyline points="1050,275 1320,275 1320,425 1050,425 1050,275" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="1062" y="302.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">FOLDING BED • S2</text><text x="1062" y="335.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Observed at 161–175 s</text><text x="1062" y="358.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Fireplace-side wall</text><rect x="925" y="610" width="415" height="105" fill="#eef0e9"/><polyline points="925,610 1340,610 1340,715 925,715 925,610" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="937" y="637.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">KITCHEN / BANQUETTE</text><text x="937" y="670.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Gold cabinets / dining</text><rect x="390" y="610" width="510" height="105" fill="#eef0e9"/><polyline points="390,610 900,610 900,715 390,715 390,610" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="402" y="637.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">VESTIBULE • S1</text><text x="402" y="670.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Proposed entry / service connection</text><rect x="55" y="405" width="310" height="195" fill="#eef0e9"/><polyline points="55,405 365,405 365,600 55,600 55,405" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="67" y="432.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">BATH • S1</text><text x="67" y="465.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Tub observed</text><text x="67" y="488.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Door position assumed</text><rect x="55" y="625" width="310" height="90" fill="#eef0e9"/><polyline points="55,625 365,625 365,715 55,715 55,625" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="67" y="652.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">CLOSET • S1</text><text x="67" y="685.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Compact service storage</text><polyline points="1110,600 1110,610" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="610,600 610,610" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="390,650 375,650 375,505 365,505" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="365,665 390,665" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="38,748 1360,748" fill="none" stroke="#536461" stroke-width="1"/><text x="38" y="790.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">S1</text><text x="110" y="788.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Choose bath/closet at the kitchen end via a short vestibule; a side-wall bath entry remains possible.</text><text x="38" y="860.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">S2</text><text x="110" y="858.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">The wall bed is now observed, replacing the earlier unresolved sleeping area.</text><text x="38" y="930.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">S3</text><text x="110" y="928.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">The window-center panel reflects the room. It is not a door to another space.</text><text x="38" y="1004.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Room sizes, exact offsets and window angles are illustrative. Read assumption ledger for alternatives.</text></svg>