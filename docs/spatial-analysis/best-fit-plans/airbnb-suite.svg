390" height="350" fill="#eef0e9"/><polyline points="420,260 810,260 810,610 420,610 420,260" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="432" y="287.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">SOFA / DINING</text><text x="432" y="320.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">French doors to bed room</text><text x="432" y="343.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Bath visible beyond door</text><rect x="840" y="175" width="500" height="435" fill="#eef0e9"/><polyline points="840,175 1340,175 1340,610 840,610 840,175" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="852" y="202.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">BED / FIREPLACE</text><text x="852" y="235.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">One main room</text><text x="852" y="258.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Shallow window bay • B3</text><rect x="420" y="640" width="390" height="85" fill="#eef0e9"/><polyline points="420,640 810,640 810,725 420,725 420,640" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="432" y="667.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">ENTRY / PATIO • B2</text><text x="432" y="700.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Chosen access location</text><polyline points="220,355 220,385" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="220,505 220,535" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="390,445 420,445" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="810,440 840,440" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="615,610 615,640" fill="none" stroke="#a56a23" stroke-width="4" stroke-dasharray="8 6"/><polyline points="38,748 1360,748" fill="none" stroke="#536461" stroke-width="1"/><text x="38" y="790.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">B1</text><text x="110" y="788.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Put kitchenette and closet on a short bath-side vestibule; their precise placement is unobserved.</text><text x="38" y="860.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">B2</text><text x="110" y="858.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Choose entry from the sofa/dining side. Access through the bed room remains an alternative.</text><text x="38" y="930.6" fill="#a56a23" font-family="Arial,sans-serif" font-size="20" font-weight="700">B3</text><text x="110" y="928.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Preserve the observed French-door join and shared bed/fireplace room; dimensions stay illustrative.</text><text x="38" y="1004.08" fill="#536461" font-family="Arial,sans-serif" font-size="16" font-weight="400">Room sizes, exact offsets and window angles are illustrative. Read assumption ledger for alternatives.</text></svg>