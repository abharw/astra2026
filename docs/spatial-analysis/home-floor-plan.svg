ill="#efeaf1"/><polyline points="695,480 955,480 955,740 695,740 695,480" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="720" y="570.24" fill="#20312f" font-family="Arial,sans-serif" font-size="23" font-weight="700">BEDROOM</text><text x="720" y="597.96" fill="#536461" font-family="Arial,sans-serif" font-size="17" font-weight="400">39–42 s: threshold only</text><text x="720" y="649.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Bed at far side</text><text x="720" y="675.96" fill="#20312f" font-family="Arial,sans-serif" font-size="17" font-weight="400">Dresser / mirror at right</text><rect x="1090" y="320" width="495" height="340" fill="#f4e9df"/><polyline points="1090,320 1585,320 1585,660 1090,660 1090,320" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="1170" y="446.12" fill="#20312f" font-family="Arial,sans-serif" font-size="24" font-weight="700">DINING ROOM</text><text x="1170" y="477.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">46–49 s; 56–end</text><rect x="1090" y="660" width="310" height="265" fill="#f6efd5"/><polyline points="1090,660 1400,660 1400,925 1090,925 1090,660" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="1115" y="737.12" fill="#20312f" font-family="Arial,sans-serif" font-size="24" font-weight="700">KITCHEN</text><text x="1115" y="765.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">49–54 s</text><text x="1115" y="802.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Range / hood</text><text x="1115" y="827.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Cabinets + fridge</text><rect x="1400" y="660" width="220" height="265" fill="#f0efdc"/><polyline points="1400,660 1620,660 1620,925 1400,925 1400,660" fill="none" stroke="#a56a23" stroke-width="2" stroke-dasharray="8 6"/><text x="1420" y="723.6" fill="#20312f" font-family="Arial,sans-serif" font-size="20" font-weight="700">UTILITY AREA</text><text x="1420" y="757.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">54–55 s</text><text x="1420" y="799.96" fill="#20312f" font-family="Arial,sans-serif" font-size="17" font-weight="400">Washer + window</text><text x="1420" y="829.96" fill="#a56a23" font-family="Arial,sans-serif" font-size="17" font-weight="400">Extent uncertain</text><polyline points="67,410 67,650" fill="none" stroke="#176c94" stroke-width="6"/><text x="85" y="535.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Curtained bay</text><text x="85" y="562.96" fill="#20312f" font-family="Arial,sans-serif" font-size="17" font-weight="400">Chairs + statue</text><polyline points="85,738 245,738" fill="none" stroke="#20312f" stroke-width="6"/><text x="90" y="712.96" fill="#20312f" font-family="Arial,sans-serif" font-size="17" font-weight="400">Fireplace / TV side</text><text x="90" y="357.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Sofa + desk side</text><polyline points="1185,322 1385,322" fill="none" stroke="#20312f" stroke-width="6"/><text x="1170" y="355.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Fireplace + mirror</text><polyline points="1584,390 1584,595" fill="none" stroke="#176c94" stroke-width="6"/><text x="1400" y="534.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Bay windows</text><text x="1400" y="562.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Dining table</text><polyline points="1190,660 1380,660" fill="none" stroke="#20312f" stroke-width="8"/><text x="1170" y="639.96" fill="#20312f" font-family="Arial,sans-serif" font-size="17" font-weight="400">Peninsula / wide opening</text><polyline points="1110,924 1375,924" fill="none" stroke="#20312f" stroke-width="6"/><text x="1105" y="896.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Appliance wall</text><polyline points="800,355 800,397" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="800,437 800,480" fill="none" stroke="#176c94" stroke-width="7"/><polyline points="515,730 355,730 355,417 1070,417" fill="none" stroke="#176c94" stroke-width="4"/><polyline points="1057.7138441335348,423.71195754045885 1070,417 1057.7138441335348,410.28804245954115" fill="none" stroke="#176c94" stroke-width="3"/><polyline points="1110,505 1140,605 1140,688" fill="none" stroke="#176c94" stroke-width="4"/><polyline points="1133.2880424595412,675.7138441335347 1140,688 1146.7119575404588,675.7138441335347" fill="none" stroke="#176c94" stroke-width="3"/><text x="1090" y="972.6" fill="#176c94" font-family="Arial,sans-serif" font-size="20" font-weight="700">Kitchen lies to your RIGHT when entering dining.</text><polyline points="600,480 600,535" fill="none" stroke="#a56a23" stroke-width="3" stroke-dasharray="8 6"/><text x="420" y="508.08" fill="#a56a23" font-family="Arial,sans-serif" font-size="16" font-weight="400">Possible second study door?</text><text x="60" y="857.36" fill="#20312f" font-family="Arial,sans-serif" font-size="22" font-weight="700">What is still imagined</text><text x="60" y="891.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">Room sizes, full outlines and offsets. The clip gives no scale or compass bearing.</text><text x="60" y="920.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">Closed-door destinations and the downstairs plan stay unassigned.</text><text x="60" y="949.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">The study–hall loop is a candidate: matching shelving is seen, but that door is not crossed.</text><polyline points="60,1000 140,1000" fill="none" stroke="#176c94" stroke-width="5"/><text x="155" y="1000.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Observed route / opening / glazing</text><polyline points="590,1000 670,1000" fill="none" stroke="#a56a23" stroke-width="3" stroke-dasharray="8 6"/><text x="685" y="1000.84" fill="#20312f" font-family="Arial,sans-serif" font-size="18" font-weight="400">Inferred room outline or connection</text><text x="60" y="1058.84" fill="#536461" font-family="Arial,sans-serif" font-size="18" font-weight="400">Evidence: full 1 fps pass + 2 fps rechecks at 28–43 s and 47 s–end; selected full-frame detail views.</text></svg>